stages:
  - validate
  - build
  - test
  - security
  - package
  - deploy
  - dast

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  TRIVY_CACHE_DIR: ".trivycache"
  SEMGREP_RULES: "p/ci"
  ZAP_TARGET_URL: ""

.docker:
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

.merge_request_or_default:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

ci:lint:
  stage: validate
  image: python:3.13-alpine
  script:
    - |
      python - <<'PY'
      import pathlib
      path = pathlib.Path(".gitlab-ci.yml")
      if not path.exists() or path.stat().st_size == 0:
          raise SystemExit(".gitlab-ci.yml is missing or empty")
      print("GitLab CI pipeline file exists.")
      PY
  rules:
    - exists:
        - .gitlab-ci.yml

test:pytest:
  stage: test
  image: python:3.13-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt
  script:
    - pytest
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  rules:
    - exists:
        - requirements-dev.txt
        - "tests/**/*.py"

quality:sonarqube:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-scanner
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  needs:
    - job: test:pytest
      artifacts: true
      optional: true
  rules:
    - if: '$SONAR_HOST_URL && $SONAR_TOKEN'

secrets:gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --report-format json --report-path gl-secret-detection-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-secret-detection-report.json
  extends: .merge_request_or_default

sast:semgrep:
  stage: security
  image: semgrep/semgrep:1.116.0
  script:
    - semgrep scan --error --config "$SEMGREP_RULES" --json --output semgrep-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - semgrep-report.json
  extends: .merge_request_or_default

dependencies:trivy:
  stage: security
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy fs --scanners vuln,secret,misconfig --format json --output trivy-fs-report.json .
    - trivy fs --scanners vuln,secret,misconfig --format table --severity HIGH,CRITICAL --exit-code 1 .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-fs-report.json
  extends: .merge_request_or_default

iac:checkov:
  stage: security
  image:
    name: bridgecrew/checkov:3.2.378
    entrypoint: [""]
  script:
    - checkov -d . --quiet --framework terraform,kubernetes,dockerfile,secrets --output cli --output json --output-file-path console,checkov-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - checkov-report.json
  rules:
    - exists:
        - "**/*.tf"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/Dockerfile"

container:build:
  stage: build
  extends: .docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
  rules:
    - exists:
        - Dockerfile

container:scan:
  stage: security
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy image --format json --output trivy-container-report.json "$IMAGE_TAG"
    - trivy image --format table --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_TAG"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-container-report.json
  needs:
    - job: container:build
      optional: true
  rules:
    - exists:
        - Dockerfile

sbom:syft:
  stage: package
  image:
    name: anchore/syft:v1.19.0
    entrypoint: [""]
  script:
    - syft dir:. -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json
  artifacts:
    expire_in: 1 month
    paths:
      - sbom.cdx.json
      - sbom.spdx.json
  extends: .merge_request_or_default

container:promote:
  stage: package
  extends: .docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker pull "$IMAGE_TAG"
    - docker tag "$IMAGE_TAG" "$IMAGE_LATEST"
    - docker push "$IMAGE_LATEST"
  needs:
    - job: container:build
      optional: true
    - job: container:scan
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists:
        - Dockerfile

deploy:review:
  stage: deploy
  image: alpine:3.21
  script:
    - echo "Add review environment deployment commands here."
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $REVIEW_APP_URL
    on_stop: deploy:review:stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $REVIEW_APP_URL'

deploy:review:stop:
  stage: deploy
  image: alpine:3.21
  script:
    - echo "Add review environment cleanup commands here."
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $REVIEW_APP_URL'

dast:zap-baseline:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  script:
    - zap-baseline.py -t "$ZAP_TARGET_URL" -J zap-report.json -r zap-report.html
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - zap-report.json
      - zap-report.html
  rules:
    - if: '$ZAP_TARGET_URL'

deploy:production:
  stage: deploy
  image: alpine:3.21
  script:
    - echo "Add production deployment commands here."
  environment:
    name: production
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
