# Complete DevSecOps pipeline for the FastAPI demo application.
# The pipeline builds, tests, scans, packages, signs, and verifies readiness before production.

stages:
  - validate
  - unit-test
  - sonarqube-scan
  - sast
  - sca
  - secret-scan
  - build-image
  - image-scan
  - dast
  - generate-sbom
  - sign-image
  - production-readiness-check

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  TRIVY_CACHE_DIR: ".trivycache"
  SEMGREP_RULES: "p/ci"
  ZAP_TARGET_URL: ""
  COSIGN_EXPERIMENTAL: "false"

.docker:
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]

.trivy-cache:
  cache:
    key: trivy-db
    paths:
      - .trivycache/

# Validate required repository files before spending runner time on heavier jobs.
validate:project:
  stage: validate
  image: alpine:3.21
  script:
    - test -f .gitlab-ci.yml
    - test -f Dockerfile
    - test -f requirements.txt
    - test -f requirements-dev.txt
    - test -f sonar-project.properties
    - test -d app
    - test -d tests
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .gitlab-ci.yml
      - sonar-project.properties

# Run Python unit tests and generate coverage.xml for SonarQube and GitLab coverage reporting.
unit-test:pytest:
  stage: unit-test
  image: python:3.13-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt
  script:
    - pytest
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml

# Run SonarQube analysis using sonar-project.properties and the coverage report from unit tests.
sonarqube:scan:
  stage: sonarqube-scan
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-scanner
    paths:
      - .sonar/cache
  script:
    - test -n "$SONAR_HOST_URL"
    - test -n "$SONAR_TOKEN"
    - sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"
  needs:
    - job: unit-test:pytest
      artifacts: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .scannerwork/report-task.txt

# Run SAST with Semgrep and fail when Semgrep finds blocking issues.
sast:semgrep:
  stage: sast
  image: semgrep/semgrep:1.116.0
  script:
    - semgrep scan --error --config "$SEMGREP_RULES" --json --output semgrep-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - semgrep-report.json

# Run dependency and filesystem SCA with Trivy, saving JSON first and then failing on High/Critical findings.
sca:trivy-fs:
  stage: sca
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  extends: .trivy-cache
  script:
    - trivy fs --scanners vuln,misconfig,secret --format json --output trivy-sca-report.json .
    - trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --format table .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-sca-report.json

# Run secret detection with Gitleaks and save the redacted JSON report.
secret-scan:gitleaks:
  stage: secret-scan
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks-report.json

# Build the Docker image and push commit-specific and latest tags to the GitLab Container Registry.
build-image:docker:
  stage: build-image
  extends: .docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
    - echo "$IMAGE_TAG" > image-tag.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - image-tag.txt
  rules:
    - exists:
        - Dockerfile

# Scan the pushed container image with Trivy and fail on High/Critical vulnerabilities.
image-scan:trivy:
  stage: image-scan
  image:
    name: aquasec/trivy:0.58.2
    entrypoint: [""]
  extends: .trivy-cache
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --format json --output trivy-image-report.json "$IMAGE_TAG"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --format table "$IMAGE_TAG"
  needs:
    - job: build-image:docker
      artifacts: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-image-report.json

# Run OWASP ZAP baseline DAST against a deployed URL provided by ZAP_TARGET_URL.
dast:zap-baseline:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  script:
    - test -n "$ZAP_TARGET_URL"
    - zap-baseline.py -t "$ZAP_TARGET_URL" -J zap-report.json -r zap-report.html
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - zap-report.json
      - zap-report.html

# Generate CycloneDX and SPDX SBOM documents for the container image.
generate-sbom:syft:
  stage: generate-sbom
  image:
    name: anchore/syft:v1.19.0
    entrypoint: [""]
  variables:
    SYFT_REGISTRY_AUTH_USERNAME: "$CI_REGISTRY_USER"
    SYFT_REGISTRY_AUTH_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - syft "$IMAGE_TAG" -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json
  needs:
    - job: build-image:docker
      artifacts: true
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - sbom.cdx.json
      - sbom.spdx.json

# Sign the container image with Cosign using COSIGN_PRIVATE_KEY and COSIGN_PASSWORD CI variables.
sign-image:cosign:
  stage: sign-image
  image:
    name: bitnami/cosign:2.4.1
    entrypoint: [""]
  variables:
    COSIGN_PASSWORD: "$COSIGN_PASSWORD"
  before_script:
    - test -n "$COSIGN_PRIVATE_KEY"
    - test -n "$COSIGN_PASSWORD"
    - echo "$COSIGN_PRIVATE_KEY" > cosign.key
    - cosign public-key --key cosign.key > cosign.pub
    - cosign login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD"
  script:
    - cosign sign --yes --key cosign.key "$IMAGE_TAG"
    - cosign verify --key cosign.pub "$IMAGE_TAG" > cosign-verify.txt
  needs:
    - job: build-image:docker
      artifacts: true
    - job: image-scan:trivy
      artifacts: true
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - cosign.pub
      - cosign-verify.txt

# Verify that required security evidence exists before production release approval.
production-readiness-check:evidence:
  stage: production-readiness-check
  image: alpine:3.21
  script:
    - test -f coverage.xml
    - test -f .scannerwork/report-task.txt
    - test -f semgrep-report.json
    - test -f trivy-sca-report.json
    - test -f gitleaks-report.json
    - test -f trivy-image-report.json
    - test -f zap-report.json
    - test -f zap-report.html
    - test -f sbom.cdx.json
    - test -f sbom.spdx.json
    - test -f cosign.pub
    - test -f cosign-verify.txt
    - echo "Production readiness evidence is present."
  needs:
    - job: unit-test:pytest
      artifacts: true
    - job: sonarqube:scan
      artifacts: true
    - job: sast:semgrep
      artifacts: true
    - job: sca:trivy-fs
      artifacts: true
    - job: secret-scan:gitleaks
      artifacts: true
    - job: image-scan:trivy
      artifacts: true
    - job: dast:zap-baseline
      artifacts: true
    - job: generate-sbom:syft
      artifacts: true
    - job: sign-image:cosign
      artifacts: true
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - coverage.xml
      - .scannerwork/report-task.txt
      - semgrep-report.json
      - trivy-sca-report.json
      - gitleaks-report.json
      - trivy-image-report.json
      - zap-report.json
      - zap-report.html
      - sbom.cdx.json
      - sbom.spdx.json
      - cosign.pub
      - cosign-verify.txt
