sonar.projectKey=devsecops-demo-api
sonar.projectName=DevSecOps Demo API
sonar.projectVersion=0.1.0

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,**/*.pyc,.venv/**,.pytest_cache/**,htmlcov/**
